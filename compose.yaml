services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redemption
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - redemption_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redemption"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redemption_postgres:
